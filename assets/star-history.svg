      .line-anim {
        stroke-dasharray: 2000;
        stroke-dashoffset: 2000;
        animation: draw 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .dot {
        transition: transform 0.2s ease, r 0.2s ease;
        cursor: pointer;
      }
      .dot:hover {
        r: 6px;
      }
      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .text { fill: #c9d1d9; }
        .grid { stroke: #30363d; }
      }
    </style>
  
